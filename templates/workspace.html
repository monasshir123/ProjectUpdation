<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DevTrack Workspace</title>

    <link rel="stylesheet" href="/static/style.css">

</head>


<body>

<nav>

    <div class="brand">

        <h2>&lt;/&gt; DevTrack</h2>

        <span>Developed by Monasshir</span>

    </div>

    <div>

        <a href="/contribution">
            Dashboard
        </a>

        <a href="/ideas">
            Flow Editor
        </a>

    </div>

</nav>


<main class="container">

    <div class="workspace-header">

        <div>

            <p>PERSONAL CODING WORKSPACE</p>

            <h1 id="workspaceTitle">
                Workspace
            </h1>

        </div>


        <div class="timer-box">

            <p>CODING TIME</p>

            <h2 id="timer">
                00:00:00
            </h2>

            <small>
                Time is saved automatically
            </small>

        </div>

    </div>


    <div class="controls">

        <button
            id="startBtn"
            class="btn"
        >
            ▶ Start
        </button>

        <button
            id="pauseBtn"
            class="btn secondary"
        >
            ⏸ Pause & Save Time
        </button>

    </div>


    <div class="workspace-layout">


        <!-- EDITOR -->

        <div class="card editor-card">

            <div class="editor-title">

                <h2>Code Editor</h2>

                <span id="languageBadge">
                    Language
                </span>

            </div>


            <div class="code-details">

                <input
                    id="codeTitle"
                    placeholder="Code title (Example: Array Program)"
                >

                <select id="codeTopic">

                    <option value="">
                        Select related topic
                    </option>

                </select>

            </div>


            <textarea
                id="codeArea"
                placeholder="Write your code here..."
            ></textarea>


            <div class="editor-actions">

                <button
                    id="saveCodeBtn"
                    class="btn"
                >
                    💾 Save Code
                </button>

                <span id="saveMessage"></span>

            </div>

        </div>


        <!-- SAVED CODE -->

        <div class="card saved-card">

            <h2>Saved Codes</h2>

            <p class="muted">
                Your codes are permanently saved for this admin.
            </p>

            <div id="savedCodeList"></div>

        </div>


        <!-- TOPICS -->

        <div class="card topics-card">

            <h2>Topics Covered</h2>

            <div id="topicList"></div>

            <h3 id="progressText">
                0 topics completed
            </h3>

            <div class="progress-bar">

                <div id="progressFill"></div>

            </div>

        </div>


    </div>

</main>


<script src="/static/script.js"></script>

</body>

</html>
