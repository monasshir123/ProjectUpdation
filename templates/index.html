<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DevTrack</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body class="login-page">

    <div class="login-box">

        <div class="logo">&lt;/&gt;</div>

        <h1>Welcome Admin 👋</h1>

        <p>Track your coding journey, time and learning progress.</p>

        <form id="loginForm">

            <label>Admin Name</label>

            <input
                type="text"
                id="adminName"
                placeholder="Enter admin name"
                autocomplete="username"
                required
            >

            <label>Admin Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                autocomplete="current-password"
                required
            >

            <button type="submit" class="btn full-btn">
                Login
            </button>

        </form>

        <p id="message"></p>

        <small>DevTrack • Developed by Monasshir</small>

    </div>

    <script src="/static/script.js"></script>

</body>
</html>
